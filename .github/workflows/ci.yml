name: CI

on:
  push:
    branches: [version-16, main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Install, seed, test (Frappe-only)
    runs-on: ubuntu-22.04

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
        with:
          path: projex

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf
          npm install -g yarn

      - name: Init bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --frappe-branch version-16 frappe-bench
          cd frappe-bench
          bench set-config -g root_password root
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:6379
          bench set-config -g redis_queue redis://127.0.0.1:6379
          bench set-config -g redis_socketio redis://127.0.0.1:6379

      - name: Get app + create site
        run: |
          cd frappe-bench
          bench get-app projex $GITHUB_WORKSPACE/projex
          bench new-site test.localhost \
            --mariadb-root-password root \
            --admin-password admin \
            --no-mariadb-socket
          bench --site test.localhost install-app projex

      - name: Idempotent seed (run twice)
        run: |
          cd frappe-bench
          bench --site test.localhost execute projex.seed.run
          before=$(bench --site test.localhost execute frappe.db.count --kwargs "{'dt': 'Projex Issue'}" | tail -1)
          bench --site test.localhost execute projex.seed.run
          after=$(bench --site test.localhost execute frappe.db.count --kwargs "{'dt': 'Projex Issue'}" | tail -1)
          test "$before" = "$after" && echo "seed idempotent ($before issues)" || (echo "seed NOT idempotent: $before != $after" && exit 1)

      - name: Run backend tests
        run: |
          cd frappe-bench
          bench --site test.localhost set-config allow_tests true
          bench --site test.localhost run-tests --app projex --skip-before-tests

      - name: Build SPA + run Playwright smoke (real browser E2E)
        run: |
          echo "127.0.0.1 test.localhost" | sudo tee -a /etc/hosts
          cd frappe-bench/apps/projex/frontend
          yarn install --frozen-lockfile
          yarn build
          npx playwright install --with-deps chromium
          cd ../../../..   # back to frappe-bench
          bench use test.localhost
          nohup bench start > /tmp/bench.log 2>&1 &
          # wait for the server
          for i in $(seq 1 30); do curl -sf http://test.localhost:8000/api/method/ping && break || sleep 2; done
          cd apps/projex/frontend
          PROJEX_BASE_URL=http://test.localhost:8000 PROJEX_USER=Administrator PROJEX_PWD=admin npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frappe-bench/apps/projex/frontend/playwright-report/
          retention-days: 7

  frontend:
    name: Build SPA
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test + build
        run: |
          npm install -g yarn
          cd frontend
          yarn install --frozen-lockfile
          yarn test
          yarn build
